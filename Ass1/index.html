<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Page Layout</title>
  <link rel="stylesheet" href="sstyle.css">
</head>
<body>
  <!-- Top Header -->
  <header class="top-header">
    <div class="bbc-logo">BBC</div>
    <nav class="nav-links">
      <a href="#">News</a>
      <a href="#">Sport</a>
      <a href="#">Reel</a>
      <a href="#">WorkLife</a>
      <a href="#">Travel</a>
      <a href="#">Future</a>
      <a href="#">More</a>
    </nav>
    <div class="search-bar">
      <input type="text" placeholder="Search">
    </div>
  </header>

  <!-- Service Sections -->
   <header class="linkedin-header">
    <div class="logo">
      <img src="./download.png">
   </div>
    <div class="search-bar">
      <input type="text" placeholder="search">
    </div>
    <nav class="icon"> 
      <img src="./house.png">
    </nav>
    <nav class="icon">
      <img src="./people.jpg">
    </nav>
    <nav class="icon">
      <img src="./pngtree-cartoon-tote-bag-image_1174743.jpg">
    </nav>
    <nav class="icon">
      <img src="./download (2).png">
    </nav>
    <nav class="icon">
      <img src="./download (1).png">
    </nav>
    <div class="profile">
      <img src="./image.png">
    </div>
   </header>
  </main>


   <!--insta-->
   
   <header class="insta-header">
    <div class="logos">
      <img src="./insta.jpg">
    </div>
    <div class="search-bar">
      <input type="text" placeholder="search">
    </div>
    <nav class="nav-icons">
      <div class="icons">
        <img src="./house.png">
      </div>
      <div class="icons">
        <img src="./send icon.png">
      </div>
      </div>
      <div class="icons">
        <img src="./heart.png">
      </div>
      <div class="icons">
        <img src="./user.jpg">
      </div>
    </nav>
   </header>
 
  <!--youtube-->
  <header class="youtube-header">
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo">
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search">
      <button class="search-button">
        <img src="./search.png" alt="Search">
      </button>
    </div>
    <nav class="nav-icons">
      <div class="icon">
        <img src="./video.png" alt="Create Video">
      </div>
      <div class="icon">
        <img src="./notifi.jpg" alt="Notifications">
      </div>
      <div class="icon">
        <img src="./image.png" alt="Profile">
      </div>
    </nav>
  </header>

  <!--fb-->
  <header class="fb-header">
    <div class="logo">Facebook</div>
    <div class="search-bar">
      <input type="text" placeholder="Search Facebook">
    </div>
    <div class="nav-icons">
      <a href="#"><img src="./house.png" alt="Home"></a>
      <a href="#"><img src="./people.jpg" alt="Friends"></a>
      <a href="#"><img src="./notifi.jpg" alt="Notifications"></a>
      <a href="#"><img src="./image.png" alt="Profile"></a>
    </div>
  </header>
 
<!--gmail-->
<header class="gmail-header">
  <div class="left-section">
    <button class="menu-btn">&#9776;</button>
    <div class="logo">Gmail</div>
  </div>
  <div class="search-bar">
    <input type="text" placeholder="Search mail">
  </div>
  <div class="right-section">
    <a href="#" class="icon"><img src="./help.png" alt="Help"></a>
    <a href="#" class="icon"><img src="./setting.png" alt="Settings"></a>
    <a href="#" class="icon"><img src="./image.png" alt="Profile"></a>
  </div>
</header>


<!--git-->
<header class="header">
  <div class="logo">B</div>
  <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#">Documentation</a>
    <a href="#">Examples</a>
    <a href="#">Icons</a>
    <a href="#">Themes</a>
    <a href="#">Expo</a>
    <a href="#">Blog</a>
  </nav>
  <div class="right-section">
    <span class="version">v4.5</span>
    <a href="#" class="icon"><img src="./git.png" alt="GitHub"></a>
    <a href="#" class="icon"><img src="./twit.png" alt="Twitter"></a>
    <a href="#" class="icon"><img src="./load.jpg" alt="Other"></a>
    <button class="download-btn">Download</button>
  </div>
</header>

<!--medium-->
  <header class="header2">
    <div class="logoo">
      medium
    </div>
    <div class="right-sections">

      <a href="#" class="icon"><img src="./search.png" alt="search"></a>
      <a href="#" class="icon"><img src="./save.png" alt="save"></a>
      
      <a href="#" class="icon"><img src="./notifi.jpg" alt="notification"></a>
      <a href="#" class="icon"><img src="./image.png" alt="profile"></a>

    </div>
  </header>
</body>
</html>
