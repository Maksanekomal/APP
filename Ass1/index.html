<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Interface Table</title>
  <link rel="stylesheet" href="sstyle.css">
</head>
<body>
  <div class="table-container">
    <div class="row">
      <div class="cell"><img src="bbc-logo.png" alt="BBC Logo"> BBC</div>
      <div class="cell">Search</div>
    </div>
    <div class="row">
      <div class="cell"><img src="cnn-logo.png" alt="CNN Logo"> CNN</div>
      <div class="cell">Search</div>
    </div>
    <div class="row">
      <div class="cell"><img src="linkedin-logo.png" alt="LinkedIn Logo"> LinkedIn</div>
      <div class="cell">Search</div>
    </div>
    <div class="row">
      <div class="cell"><img src="instagram-logo.png" alt="Instagram Logo"> Instagram</div>
      <div class="cell">Search</div>
    </div>
    <div class="row">
      <div class="cell"><img src="youtube-logo.png" alt="YouTube Logo"> YouTube</div>
      <div class="cell">Search</div>
    </div>
    <div class="row">
      <div class="cell"><img src="facebook-logo.png" alt="Facebook Logo"> Facebook</div>
      <div class="cell">Search</div>
    </div>
    <div class="row">
      <div class="cell"><img src="gmail-logo.png" alt="Gmail Logo"> Gmail</div>
      <div class="cell">Search</div>
    </div>
    <div class="row">
      <div class="cell"><img src="medium-logo.png" alt="Medium Logo"> Medium</div>
      <div class="cell">Search</div>
    </div>
  </div>
</body>
</html>
