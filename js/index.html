<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year Checker</title>
</head>
<body>
    <h2>Leap Year Checker</h2>
    <label for="year">Enter a year:</label>
    <input type="number" id="year" name="year">
    <button onclick="checkLeapYear()">Check Leap Year</button>
    
    <p id="result"></p>

    <script>
        function isLeapYear(year) {
            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
                return true;
            } else {
                return false;
            }
        }

        function checkLeapYear() {
            const year = document.getElementById("year").value;
            const resultElement = document.getElementById("result");

            if (year) {
                if (isLeapYear(parseInt(year))) {
                    resultElement.textContent = `${year} is a leap year.`;
                } else {
                    resultElement.textContent = `${year} is not a leap year.`;
                }
            } else {
                resultElement.textContent = "Please enter a valid year.";
            }
        }
    </script>
</body>
</html>
