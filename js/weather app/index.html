<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Weather App</h2>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h4 id="city-name" class="text-center">Enter a City</h4>
          <input type="text" id="city-input" class="form-control mb-3" placeholder="City Name">
          <button id="get-weather-btn" class="btn btn-primary btn-block">Get Weather</button>
          <div id="weather-info" class="mt-3" style="display:none;">
            <h5 class="text-center" id="temperature"></h5>
            <p id="weather-description" class="text-center"></p>
            <p id="humidity" class="text-center"></p>
            <p id="wind-speed" class="text-center"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
